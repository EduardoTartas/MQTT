# =============================================================================
# mosquitto.conf — Configuração do Broker MQTT Mosquitto
# =============================================================================
#
# Este arquivo configura o comportamento do broker Eclipse Mosquitto dentro
# do container Docker. O broker é responsável por:
#   - Receber conexões de clientes MQTT (ESP32, dashboard, mosquitto_sub)
#   - Rotear mensagens entre publicadores e assinantes pelo tópico
#   - Persistir mensagens retidas no disco
# =============================================================================

# --- Listener MQTT (TCP puro) ---
# O ESP32 conecta nesta porta usando o protocolo MQTT padrão sobre TCP.
# Porta 1883 é a porta oficial registrada para MQTT (sem TLS).
listener 1883
protocol mqtt

# --- Listener WebSocket ---
# O dashboard HTML (rodando no browser) não pode abrir sockets TCP diretamente.
# WebSocket é um protocolo que funciona sobre HTTP/HTTPS, aceito por browsers.
# A biblioteca mqtt.js no dashboard conecta em ws://IP:9001/mqtt usando esta porta.
listener 9001
protocol websockets

# --- Autenticação ---
# allow_anonymous true → qualquer cliente pode conectar sem usuário/senha.
# Adequado para ambiente de laboratório/desenvolvimento.
# Em produção, desativar e configurar arquivo de senhas com mosquitto_passwd.
allow_anonymous true

# --- Persistência de dados ---
# persistence true → o broker salva mensagens retidas (retained) e sessões
# persistentes no disco. Assim, se o broker reiniciar, os dados não são perdidos.
persistence true

# Caminho interno do container onde os dados persistidos são gravados.
# Mapeado para ./data/ no host via volume no docker-compose.yml.
persistence_location /mosquitto/data/

# --- Logs ---
# Grava log em arquivo (visível no host em ./log/mosquitto.log) e também
# no stdout do container (visível via "docker compose logs -f mosquitto").
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
